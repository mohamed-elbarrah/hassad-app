# docker-compose.yml — monorepo root
services:
  postgres:
    image: postgres:17-alpine
    container_name: hassad_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hassad
      POSTGRES_PASSWORD: hassad_dev_password
      POSTGRES_DB: hassad
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hassad -d hassad"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hassad_pgdata:/var/lib/postgresql/data

  backup-worker:
    profiles: [backup]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hassad-backup-worker-dev
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      APP_PROCESS: backup-worker
      DATABASE_URL: postgresql://hassad:hassad_dev_password@postgres:5432/hassad
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hassad_pgdata:
    driver: local
